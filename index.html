<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DietMate | Your Personal Healthy Diet Companion</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/navbar.css" />

    <link rel="stylesheet" href="css/footer.css" />

    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <section class="hero">
        <!-- Background Decoration -->
        <div class="blur-circle blur-1"></div>
        <div class="blur-circle blur-2"></div>

        <div class="container">
          <div class="row align-items-center gy-5">
            <!-- Left -->
            <div class="col-lg-6">
              <span class="hero-badge hero-animate">
                🌿 Healthy Lifestyle Starts Here
              </span>

              <h1 class="hero-title hero-animate">
                Your Personal

                <span>Healthy Diet</span>

                Companion
              </h1>

              <p class="hero-description hero-animate">
                Understand your body, discover personalized nutrition, and build
                healthier habits through one simple health assessment.
              </p>

              <div class="hero-buttons hero-animate">
                <a href="pages/assessment.html" class="btn btn-primary-custom">
                  Start Assessment
                </a>

                <a href="#features" class="btn btn-outline-custom">
                  Explore Features
                </a>
              </div>
            </div>

            <!-- Right -->
            <div class="col-lg-6">
              <div class="hero-image-wrapper">
                <div class="hero-image-container hero-image-animate">
                  <div class="hero-blob"></div>

                  <img
                    src="assets/images/hero-food-Photoroom.png"
                    class="hero-image"
                    alt="Healthy Food"
                  />

                  <!-- Floating Cards -->

                  <div class="floating-card card-calories hero-card">
                    🔥
                    <div>
                      <small>Calories</small>
                      <h6>1850 kcal</h6>
                    </div>
                  </div>

                  <div class="floating-card card-bmi hero-card">
                    ⚖️
                    <div>
                      <small>BMI</small>
                      <h6>Normal</h6>
                    </div>
                  </div>

                  <div class="floating-card card-score hero-card">
                    ❤️
                    <div>
                      <small>Healthy Score</small>
                      <h6>92%</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
      AOS.init({
        duration: 700,
        once: true,
      });
    </script>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script src="js/main.js"></script>
    <script src="js/hero.js"></script>
  </body>
</html>
