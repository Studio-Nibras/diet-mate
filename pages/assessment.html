<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Complete your DietMate health assessment and start your personalized health journey."
    />

    <title>Assessment | DietMate</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="../css/assessment.css"
    />
  </head>

  <body>

    <main class="assessment-section">

      <div class="container">

        <div class="assessment-card">

          <div
            class="progress-wrapper"
            aria-label="Assessment progress"
          >

            <div
              class="step active"
              aria-label="Step 1"
            ></div>

            <div
              class="step"
              aria-label="Step 2"
            ></div>

            <div
              class="step"
              aria-label="Step 3"
            ></div>

            <div
              class="step"
              aria-label="Step 4"
            ></div>

          </div>

          <div id="step-content"></div>

          <div class="wizard-navigation">

            <button
              id="prevBtn"
              type="button"
              class="btn btn-outline-success"
              disabled
            >
              <i class="bi bi-arrow-left"></i>

              <span>Kembali</span>
            </button>


            <button
              id="nextBtn"
              type="button"
              class="btn btn-success"
            >
              <span>Lanjut</span>

              <i class="bi bi-arrow-right"></i>
            </button>

          </div>

        </div>

        <div
          id="loadingOverlay"
          class="loading-overlay d-none"
          role="dialog"
          aria-modal="true"
          aria-labelledby="analysisTitle"
        >

          <div class="loading-card">

            <div
              class="spinner-border text-success mb-4"
              role="status"
              aria-label="Analyzing"
            ></div>


            <h3 id="analysisTitle">
              Sedang Menganalisis...
            </h3>

            <p
              id="loadingMessage"
              class="text-success fw-semibold mt-3"
            >
              DietMate AI sedang menganalisis tubuhmu...
            </p>


            <p class="text-secondary">
              Kami sedang menghitung kondisi tubuhmu.
            </p>

            <div class="analysis-list mt-4">

              <div id="status-1">
                ○ Menganalisis data pribadi
              </div>

              <div id="status-2">
                ○ Menghitung Body Mass Index
              </div>

              <div id="status-3">
                ○ Menghitung Basal Metabolic Rate
              </div>

              <div id="status-4">
                ○ Menghitung kebutuhan kalori harian
              </div>

              <div id="status-5">
                ○ Menyesuaikan target diet
              </div>

              <div id="status-6">
                ○ Menyiapkan Dashboard
              </div>

            </div>

          </div>

        </div>

      </div>

    </main>

    <script src="../js/calculation.js"></script>

    <script src="../js/storage.js"></script>


    <script src="../js/assessment/wizard.js"></script>

    <script src="../js/assessment/ui.js"></script>

    <script src="../js/assessment/validation.js"></script>

    <script src="../js/assessment/assessment.js"></script>

  </body>
</html>
