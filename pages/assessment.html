<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Assessment | DietMate</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="../css/assessment.css" />
  </head>

  <body>
    <section class="assessment-section">
      <div class="container">
        <div class="assessment-card">
          <!-- Progress -->

          <div class="progress-wrapper">
            <div class="step active"></div>
            <div class="step"></div>
            <div class="step"></div>
            <div class="step"></div>
          </div>

          <!-- Content -->

          <div id="step-content"></div>

          <!-- Navigation -->

          <div class="wizard-navigation">
            <button id="prevBtn" class="btn btn-outline-success" disabled>
              Back
            </button>

            <button id="nextBtn" class="btn btn-success">Next</button>
          </div>
        </div>
        <div id="loadingOverlay" class="loading-overlay d-none">
          <div class="loading-card">
            <div class="spinner-border text-success mb-4"></div>

            <h3>Sedang Menganalisis...</h3>

            <p id="loadingMessage" class="text-success fw-semibold mt-3">
              DietMate AI sedang menganalisis tubuhmu...
            </p>

            <p class="text-secondary">
              Kami sedang menghitung kondisi tubuhmu.
            </p>

            <div class="analysis-list mt-4">
              <div id="status-1">○ Menganalisis data pribadi</div>

              <div id="status-2">○ Menghitung Body Mass Index</div>

              <div id="status-3">○ Menghitung Basal Metabolic Rate</div>

              <div id="status-4">○ Menghitung kebutuhan kalori harian</div>

              <div id="status-5">○ Menyesuaikan target diet</div>

              <div id="status-6">○ Menyiapkan Dashboard</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="../js/calculation.js"></script>
    <script src="../js/storage.js"></script>

    <script src="../js/assessment/wizard.js"></script>
    <script src="../js/assessment/ui.js"></script>
    <script src="../js/assessment/validation.js"></script>
    <script src="../js/assessment/assessment.js"></script>
  </body>
</html>
